function need(l,g){const u=U[l.u]||U[ub(g)],b=l.q*u.f,t=u.t,gt=U[g.u].t;if(t===gt)return b;if(t==='p'||gt==='p')return null;const d=gt==='v'?1:g.cup>0?g.cup/240:0;if(!d)return null;return t==='v'?b*d:b/d}
function calc(r){let t=0,bad=0,bn=[];r.items.forEach(l=>{const g=ing(l.i);if(!g)return;const n=need(l,g);if(n==null){bad++;bn.push(g.n)}else t+=n*uc(g)});const u=r.por>0?t/r.por:0,ut=r.price-u;
return{t,u,ut,bad,bn,mg:r.price>0?ut/r.price*100:0,sg:cfg.target>0?u/(cfg.target/100):0,tu:ut*r.por}}

${r.note?`<div class="note">${E(r.note)}</div>`:''}`}
const fr=(n,g)=>{const b=ub(g);return b==='g'&&n>=1000?N(n/1000)+' kg':b==='ml'&&n>=1000?N(n/1000)+' l':N(n)+' '+b};
const HV=()=>{db.have=db.have||{};return db.have[sel]=db.have[sel]||{}};
const bc=i=>i.bulk?i.m/i.size*i.up:i.m*i.up;

function hv(id,d){const H=HV();H[id]=Math.max(0,(+H[id]||0)+d);save();render()}
function hs(id,v){HV()[id]=Math.max(0,+v||0);save();render()}
function plan(r){const H=HV(),agg={};r.items.forEach(l=>{const g=ing(l.i);if(!g)return;const n=need(l,g);agg[g.id]=(agg[g.id]||0)+(n||0)});
return Object.keys(agg).map(id=>{const g=ing(id),n=agg[id],have=+H[id]||0,size=g.q*U[g.u].f;let m,lab,cost,ctl;
if(g.bulk){m=Math.max(0,n-have);lab=fr(m,g);cost=m/size*g.p;ctl=`<span class="of">Ya tengo</span><input type="number" min="0" step="any" inputmode="decimal" placeholder="0" value="${have||''}" aria-label="Tengo de ${E(g.n)}" onchange="hs('${id}',this.value)"><span class="of">${ub(g)}</span>`}
else{const pk=Math.ceil(n/size-1e-9);m=Math.max(0,pk-have);lab=`${m} ${m>1?'paquetes':'paquete'} de ${N(g.q)} ${E(g.u)}`;cost=m*g.p;ctl=`<span class="of">Ya tengo</span><button class="ib" aria-label="Menos" onclick="hv('${id}',-1)">−</button><b>${have}</b><button class="ib" aria-label="Más" onclick="hv('${id}',1)">+</button>`}
return{g,m,size,lab,cost,ctl,full:m<=1e-9}}).sort((a,b)=>a.full-b.full)}

<div style="margin-top:12px">${its.map(x=>`<div class="si ${x.full?'done':''}"><div class="sb"><div class="rw"><b>${E(x.g.n)}</b><span class="pr">${x.full?'':M(x.cost)}</span></div><div class="fl">${x.full?'Ya lo tienes':'Comprar '+x.lab}</div><div class="hv">${x.ctl}</div></div></div>`).join('')}</div>

db.buys=db.buys||[];const id=uid();db.buys.unshift({id,rid:r.id,n:r.n,d,items});if(db.have)delete db.have[r.id];save();ask0();go('buy',id)}

return`<div class="top"><button class="btn ghost sm" onclick="go('shop')">← Compras</button>${buyEd?'<button class="btn" style="padding:12px 28px;font-size:1.05rem" onclick="buyEd=false;render()">Listo</button>':`<button class="btn ghost sm" aria-label="Más opciones" onclick="bmenu('${x.id}')">${ic('dots')}</button>`}</div>

<div style="margin-top:12px">${x.items.map((i,k)=>`<div class="si ${i.done?'done':''}"><button class="ck" role="checkbox" aria-checked="${i.done}" aria-label="Comprado: ${E(i.n)}" onclick="tg(${k})"></button><div class="sb"><div class="rw"><b>${E(i.n)}</b><span class="pr">${M(bc(i))}</span></div><div class="fl">${bl(i)}</div>${buyEd?`<div class="hv"><span class="of" style="font-weight:700;color:var(--ink);font-size:.95rem">Nuevo precio de ${E(i.pu)}</span><input type="number" min="0" step="any" inputmode="decimal" value="${i.up}" onchange="sup(${k},this.value)"></div>`:''}</div></div>`).join('')}</div>
<div class="stats"><div class="stat s1"><small>Pendiente</small><strong>${M(p)}</strong></div><div class="stat s0"><small>Total</small><strong>${M(t)}</strong></div></div>`}

function cv(){const a=+$v('ca'),x=U[$v('cu')],y=U[$v('cw')];cr.textContent=!a?'—':x.t!==y.t?'Estas unidades no son del mismo tipo.':N(a*x.f/y.f)+' '+$v('cw')}
function vCfg(){const ks=Object.keys(U),o=id=>want===id?' open':'',w=db.ing.filter(i=>U[i.u].t==='w'),miss=w.filter(i=>!(i.cup>0)).length;want=null;return`<div class="top"><div><h2>Configuración</h2></div></div>
<div class="panel"><div class="f"><div><label for="cn">Nombre</label><input id="cn" value="${E(cfg.cafe)}"></div><div><label for="cm">Moneda</label><input id="cm" maxlength="4" value="${E(cfg.cur)}"></div><div><label for="ct">Costo objetivo %</label><input id="ct" type="number" min="1" max="100" value="${cfg.target}"></div><div><label for="cr">Redondear costos</label>${dd('cr',[['0','Sin redondeo'],['0.5',cfg.cur+'0.50'],['1',cfg.cur+'1'],['5',cfg.cur+'5']],String(cfg.round||0))}</div></div><div class="row"><button class="btn" onclick="saveCfg()">Guardar</button><span id="ok" class="hand"></span></div></div>
<details class="panel" id="dg"${o('dg')}><summary>Gramos por taza${miss?`<span class="badge">${miss}</span>`:''}</summary>${w.length?w.map(i=>`<div class="cup ${i.cup>0?'':'miss'}"><span>${E(i.n)}</span><input type="number" min="0" step="any" inputmode="decimal" placeholder="g" aria-label="Gramos por taza de ${E(i.n)}" value="${i.cup||''}" oninput="ing('${i.id}').cup=+this.value;this.parentNode.classList.toggle('miss',!(+this.value>0));save()"> g</div>`).join(''):'<div class="empty">—</div>'}</details>
<details class="panel" id="du"${o('du')}><summary>Unidades</summary><div class="f"><div><label for="un">Nombre</label><input id="un" placeholder="vaso"></div><div><label for="ut">Tipo</label>${dd('ut',Object.keys(TN).map(t=>[t,TN[t]]),'w')}</div><div><label for="uf">Equivale a</label><input id="uf" type="number" min="0" step="any"></div></div><p id="eu" class="neg" role="alert"></p><button class="btn alt" onclick="saveUnit()">Guardar unidad</button><div style="margin-top:12px">${ks.map((k,j)=>`<div class="li"><b class="n">${E(k)}</b><span class="q">${N(U[k].f)} ${BN[U[k].t]}</span><button class="tb" onclick="editU(${j})">Editar</button>${Object.values(BN).includes(k)?'':`<button class="tb dg" onclick="ask('¿Quitar esta unidad?',()=>delUnit(${j}),'Quitar')">Quitar</button>`}</div>`).join('')}</div></details>
<details class="panel" id="dk"${o('dk')}><summary>Respaldo</summary><textarea id="bk" rows="4" onfocus="this.select()">${E(JSON.stringify(db))}</textarea><p id="er" class="neg" role="alert"></p><div class="row"><button class="btn alt" onclick="loadBk()">Cargar respaldo</button><button class="btn ghost" onclick="armDel(this,()=>{db=seed();cfg=db.cfg;U=cfg.units;save();render()})">Restablecer ejemplo</button></div></details>`}
function editU(j){const k=Object.keys(U)[j];un.value=k;ddset('ut',U[k].t);uf.value=U[k].f;un.focus()}
function saveUnit(){const n=un.value.trim(),f=+uf.value,t=ut.value;if(!n||!(f>0)){eu.textContent='Escribe un nombre y una equivalencia mayor a 0.';return}
if(Object.values(BN).includes(n)){eu.textContent='Las unidades base (g, ml, pza) no se pueden cambiar.';return}U[n]={t,f};save();want='du';render()}
function delUnit(j){const k=Object.keys(U)[j];if(db.ing.some(i=>i.u===k)||db.rec.some(r=>r.items.some(l=>l.u===k))){eu.textContent=`“${k}” está en uso en un ingrediente o una receta.`;return}delete U[k];save();want='du';render()}
function saveCfg(){cfg.cafe=$v('cn').trim()||'Mi recetario';cfg.cur=$v('cm')||'$';cfg.target=+$v('ct')||35;cfg.round=+$v('cr')||0;save();render();ok.textContent='¡Guardado!'}
function loadBk(){try{const d=JSON.parse($v('bk'));if(!d.ing||!d.rec||!d.cfg)throw 0;if(!d.cfg.units)d.cfg.units=DU();db=d;cfg=d.cfg;U=cfg.units;save();render()}catch(e){er.textContent='El texto no es un respaldo válido.'}}
const uo=()=>Object.keys(U).map(u=>[u,u]);
const dd=(id,opts,val,ch,ph)=>{const cur=opts.find(o=>o[0]===val);return`<div class="dd"><input type="hidden"${id?` id="${id}"`:''} value="${E(val)}"${ch?` onchange="${ch}"`:''}><button type="button" class="ddb" aria-haspopup="listbox" onclick="ddt(this)"><span>${cur?E(cur[1]):ph||'Elegir…'}</span><i>▾</i></button><div class="ddl" role="listbox">${opts.map(o=>`<button type="button" class="${o[0]===val?'sel':''}" data-v="${E(o[0])}" onclick="ddp(this)">${E(o[1])}</button>`).join('')}</div></div>`};
const lk=()=>document.documentElement.classList.toggle('lock',!!document.querySelector('.dd.open')||!mdl.hidden);
const cl=()=>{document.querySelectorAll('.dd.open').forEach(x=>x.classList.remove('open'));lk()};
function ddt(b){const d=b.closest('.dd'),o=!d.classList.contains('open');cl();d.classList.toggle('open',o);lk();if(o){const x=d.querySelector('.sel');if(x)x.scrollIntoView({block:'center'})}}
function ddp(b){const d=b.closest('.dd'),h=d.querySelector('input');h.value=b.dataset.v;d.querySelector('.ddb span').textContent=b.textContent;d.querySelectorAll('.ddl button').forEach(x=>x.classList.toggle('sel',x===b));d.classList.remove('open');lk();h.dispatchEvent(new Event('change'))}
function ddset(id,v){const h=document.getElementById(id),d=h.closest('.dd');h.value=v;d.querySelectorAll('.ddl button').forEach(x=>{const k=x.dataset.v===v;x.classList.toggle('sel',k);if(k)d.querySelector('.ddb span').textContent=x.textContent})}
const gw=t=>{if(t.scrollHeight){t.style.height='auto';t.style.height=t.scrollHeight+'px'}},fit=()=>document.querySelectorAll('textarea:not(#bk)').forEach(gw);
addEventListener('click',e=>{if(!e.target.closest('.ddb,.ddl'))cl()});
addEventListener('keydown',e=>{if(e.key==='Escape'){drawer(0);cl();ask0()}});
function sh(h){mdl.innerHTML=`<div class="mx" onclick="ask0()"></div><div class="ms">${h}</div>`;mdl.hidden=false;lk()}
function ask(m,f,b){ak=f;sh(`<p>${E(m)}</p><div class="row"><button class="btn ghost" onclick="ask0()">Cancelar</button><button class="btn dng" onclick="const f=ak;ask0();f()">${b||'Eliminar'}</button></div>`)}
function ask0(){mdl.hidden=true;mdl.innerHTML='';lk()}
function por(d){draft.por=Math.max(1,Math.round((+draft.por||0)+d));dp.value=draft.por;live()}
function ci(){idr={n:$v('in'),q:$v('iq'),u:$v('iu'),p:$v('ip'),bulk:ibs.querySelector('.on').dataset.b==='1'}}
function sg(b){b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));ci()}

/* ---------- Puente con Capacitor (se ignora al abrir en un navegador) ---------- */
(function native(){
const C=window.Capacitor;
if(!C||typeof C.isNativePlatform!=='function'||!C.isNativePlatform())return;
const P=C.Plugins||{};document.documentElement.dataset.native='1';
const isDark=()=>{try{return matchMedia('(prefers-color-scheme:dark)').matches}catch(e){return false}};
// Iconos de la barra de estado y de navegación acordes al tema
const bars=()=>{try{const p=P.SystemBars;p&&p.setStyle({style:isDark()?'DARK':'LIGHT'}).catch(()=>{})}catch(e){}};
bars();
try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',bars)}catch(e){}
// Botón atrás de Android: cierra capas antes de salir de la app
try{
  P.App&&P.App.addListener('backButton',()=>{
    if(!mdl.hidden){ask0();return}
    if(document.querySelector('.dd.open')){cl();return}
    if(dr.classList.contains('on')){drawer(0);return}
    if(view!=='rec'){go('rec');return}
    P.App.exitApp();
  }).catch(()=>{});
}catch(e){}
})();
render();
</script></body></html>
